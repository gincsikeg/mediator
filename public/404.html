<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <title>Kis Georgina – pénzügyi mediátor</title>
    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages  (MIT licenc)
      // pathSegmentsToKeep = 1  ->  a repo nevét (pl. /kis-georgina-mediator/) megtartja.
      // Ha saját domainre vagy a felhasznalonev.github.io gyökerére teszed, állítsd 0-ra.
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
